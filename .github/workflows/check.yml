name: Check extension

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("manifest.json").read_text(encoding="utf-8"))
          assert manifest["manifest_version"] == 3
          assert manifest["name"] == "UIS+"
          assert manifest["permissions"] == ["storage"]
          assert manifest["host_permissions"] == ["https://is.stuba.sk/*"]
          PY
      - name: Check JavaScript syntax
        run: |
          node --check content.js
          node --check boss-fight.js
          node --check popup.js
      - name: Check required files
        run: |
          test -f styles.css
          test -f boss-fight.css
          test -f popup.html
          test -f icons/icon-128.png
          test -f LICENSE
          test -f PRIVACY.md
