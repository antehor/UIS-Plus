name: Publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate source
        run: |
          node --check content.js
          node --check boss-fight.js
          node --check popup.js
          python -m json.tool manifest.json >/dev/null
      - name: Build unpacked extension archive
        run: |
          mkdir -p package/UIS-plus
          cp manifest.json content.js styles.css boss-fight.js boss-fight.css popup.html popup.css popup.js INSTALL.html README.md CHANGELOG.md LICENSE PRIVACY.md package/UIS-plus/
          cp -R icons package/UIS-plus/icons
          cp -R assets package/UIS-plus/assets
          cp -R docs package/UIS-plus/docs
          cd package
          zip -r "UIS-plus-${GITHUB_REF_NAME}.zip" UIS-plus
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v heading="## ${VERSION}" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          gh release create "$GITHUB_REF_NAME" "package/UIS-plus-${GITHUB_REF_NAME}.zip" \
            --title "UIS+ ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md
