<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>UIS+</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <span class="mark"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
    <div><b>UIS+</b><small>STU UIS · FORMERLY AIS+</small></div>
    <span class="local">LOCAL</span>
  </header>
  <main>
    <label class="setting main-setting">
      <span><b>Enable UIS+</b><small>For STU UIS at is.stuba.sk</small></span>
      <input id="enabled" type="checkbox"><i class="switch"></i>
    </label>
    <section>
      <span class="caption">Appearance</span>
      <div class="segments" role="radiogroup" aria-label="Appearance">
        <label><input type="radio" name="theme" value="system"><span>System</span></label>
        <label><input type="radio" name="theme" value="light"><span>Light</span></label>
        <label><input type="radio" name="theme" value="dark"><span>Dark</span></label>
      </div>
    </section>
    <section>
      <span class="caption">Panel language</span>
      <div class="segments" role="radiogroup" aria-label="Panel language">
        <label><input type="radio" name="language" value="en"><span>EN</span></label>
        <label><input type="radio" name="language" value="sk"><span>SK</span></label>
        <label><input type="radio" name="language" value="cs"><span>CZ</span></label>
      </div>
    </section>
    <label class="setting">
      <span><b>Compact layout</b><small>Show more information at once</small></span>
      <input id="compact" type="checkbox"><i class="switch"></i>
    </label>
    <label class="setting boss-setting">
      <span><b>⚔ Boss Fight</b><small>Experimental fun mode</small></span>
      <input id="bossFightEnabled" type="checkbox"><i class="switch"></i>
    </label>
  </main>
  <footer><span></span>UIS+ 2.3 · FORMERLY AIS+</footer>
  <script src="popup.js"></script>
</body>
</html>
